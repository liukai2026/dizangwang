<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地藏王菩萨 · 本愿经 · 法音宣流</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0b0a08;
            color:#d4c9b8;
            font-family: "Noto Serif SC", "KaiTi", "楷体", serif;
            min-height:100vh;
            padding:20px;
            display:flex;
            justify-content:center;
        }
        .container {
            max-width:900px;
            width:100%;
            background:rgba(20,18,15,0.85);
            border:1px solid #5a4e3e;
            border-radius:24px;
            padding:30px 24px 40px;
            box-shadow:0 0 60px rgba(180,120,60,0.06);
        }
        .buddha-image {
            width:100%;
            max-width:300px;
            height:auto;
            border-radius:16px;
            margin:0 auto 20px;
            display:block;
            background:#1f1b16;
            padding:8px;
            border:1px solid #6a5d4a;
        }
        h1 {
            font-size:2.2rem;
            font-weight:400;
            letter-spacing:12px;
            color:#e6dcc8;
            text-align:center;
            margin-bottom:4px;
        }
        .subtitle {
            text-align:center;
            font-size:1rem;
            color:#9a8b78;
            letter-spacing:6px;
            margin-bottom:24px;
        }
        .sutra-container {
            max-height:200px;
            overflow-y:auto;
            padding:16px 20px;
            background:rgba(30,27,22,0.6);
            border-left:3px solid #8a7a62;
            border-radius:8px;
            margin-bottom:24px;
            font-size:1.05rem;
            line-height:2.0;
            text-align:justify;
            color:#cfc4b0;
        }
        .sutra-container::-webkit-scrollbar { width:4px; }
        .sutra-container::-webkit-scrollbar-track { background:#1f1b16; }
        .sutra-container::-webkit-scrollbar-thumb { background:#6a5d4a; border-radius:8px; }
        .sutra-container p { margin-bottom:6px; }
        .audio-wrapper {
            background:#1a1713;
            border-radius:60px;
            padding:14px 20px;
            border:1px solid #4a4035;
        }
        audio {
            width:100%;
            height:54px;
            outline:none;
            background:transparent;
            border-radius:40px;
        }
        audio::-webkit-media-controls-panel { background:#1a1713; }
        audio::-webkit-media-controls-play-button { background:#5a4e3e; border-radius:50%; }
        .audio-label {
            text-align:center;
            font-size:0.85rem;
            color:#9a8b78;
            letter-spacing:2px;
            margin-top:10px;
        }
        @media (max-width:600px) {
            .container { padding:16px 12px 24px; }
            h1 { font-size:1.5rem; letter-spacing:6px; }
            .sutra-container { font-size:0.95rem; max-height:360px; padding:12px 14px; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- 佛像：使用维基百科的稳定图片 -->
    <img class="buddha-image"
         src="dizangjing.jpg"
         alt="地藏王菩萨"
         loading="lazy" />

    <h1>南无地藏王菩萨</h1>
    <div class="subtitle">—— 本愿经 · 法音宣流 ——</div>

    <div class="sutra-container" id="jingwenDisplay">
        <p style="color:#9a8b78; text-align:center;">正在加载经文……</p>
    </div>

    <div class="audio-wrapper">
        <audio controls loop autoplay>
            <!-- 使用华藏数位图书馆的地藏经音频（稳定、可公开访问） -->
            <source src="dizangjing.mp3" type="audio/mpeg">
            您的浏览器不支持音频播放。
        </audio>
    </div>
    <div class="audio-label">🎧 法音不断 · 尽虚空遍法界</div>

</div>

<script>
// 经文从你仓库的 jingwen.txt 加载
fetch('jingwen.txt')
    .then(response => {
        if (!response.ok) throw new Error('经文文件加载失败，请确认 jingwen.txt 已上传');
        return response.text();
    })
    .then(text => {
        const paragraphs = text.split(/\n\s*\n/).filter(p => p.trim().length > 0);
        document.getElementById('jingwenDisplay').innerHTML = paragraphs.map(p => `<p>${p.trim().replace(/\n/g, '<br />')}</p>`).join('');
    })
    .catch(error => {
        document.getElementById('jingwenDisplay').innerHTML = `<p style="color:#b8a68b;text-align:center;">经文加载失败：${error.message}</p>`;
    });
</script>

</body>
</html>
